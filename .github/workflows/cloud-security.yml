name: Cloud Security Suite CI
on: [push]

permissions:
  contents: read

jobs:
  secure-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Debug: Let's see EXACTLY what GitHub sees
      - name: List actual paths
        run: find . -maxdepth 3 -not -path '*/.*'

      # 2. Terraform Scan: Scan everything to avoid path errors
      - name: Terraform Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          check: CKV_AWS_18,CKV_AWS_19,CKV_AWS_144 # Focus on the S3 wins

      # 3. Build Docker: Search for the Dockerfile automatically
      - name: Build Secure Container
        run: |
          DOCKER_PATH=$(find . -name "Dockerfile" -print -quit)
          DOCKER_DIR=$(dirname "$DOCKER_PATH")
          echo "Building from: $DOCKER_DIR"
          cd "$DOCKER_DIR"
          docker build -t security-tool:latest .
