name: Cloud Security Suite CI
on: [push]

permissions:
  contents: read

jobs:
  secure-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This step scans your Terraform code
      - name: Terraform Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: projects/01-S3-Hardening
          framework: terraform

      # This step builds your Docker image from the correct folder
      - name: Build Secure Container
        run: |
          cd projects/03-DevSecOps-CI-CD
          docker build -t security-tool:latest .
